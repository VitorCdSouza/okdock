name: okdock

services:
  okdock:
    build: .
    image: ghcr.io/vitorcdsouza/okdock:latest
    # make deploy loads the image here and passes --pull never, this is the CI path
    pull_policy: always
    container_name: okdock
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
      - ./templates:/templates
      # the folder before this one, the same path on both sides
      - ${PWD}/..:${PWD}/..
    environment:
      OKDOCK_MEMORY_RESERVE: 2g
      OKDOCK_LOG_LEVEL: info
