name: docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: okdock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: panel answers
        run: |
          docker run -d --name okdock -p 8080:8080 okdock:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/v1/health; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { docker logs okdock; exit 1; }
          curl -fs http://localhost:8080/api/v1/templates | grep -q 'itzg/minecraft-server'
          curl -fs http://localhost:8080/ | grep -q '<app-root>'

      - name: log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the image only gets published after the smoke test above, and the cache
      # makes this a retag of what was already built
      - name: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vitorcdsouza/okdock:latest
            ghcr.io/vitorcdsouza/okdock:${{ github.sha }}
          cache-from: type=gha
