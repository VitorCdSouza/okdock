name: api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/ci-api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/ci-api.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "arquivos fora do gofmt:"; echo "$out"; exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...

      - run: go build ./...
