<!doctype html>
<meta charset="utf-8">
<title>OkDock</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; background: #0a0a09; color: #f0eeea;
         display: grid; place-items: center; min-height: 100vh; margin: 0; }
  main { max-width: 34rem; padding: 2rem; }
  code { background: #242322; padding: .15em .4em; border-radius: 3px; }
</style>
<main>
  <h1>Frontend not embedded</h1>
  <p>This binary was built without the Angular bundle. The API under
     <code>/api/v1</code> works normally.</p>
  <p>To embed the panel: <code>make build</code> at the root of the repository,
     or <code>docker compose up --build</code>.</p>
  <p>In development, run <code>ng serve</code> inside <code>web/</code> and open
     <code>http://localhost:4200</code>.</p>
</main>
